<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alice & Kévin – Mariage</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#fafafa;
  --paper:#f6f3ee;
  --seal:#e9e4dc;
  --text:#111;
  --line:#e6e6e6;
}

body{
  margin:0;
  font-family:"Cormorant Garamond", serif;
  background:var(--bg);
  color:var(--text);
  text-align:center;
}

/* ========== ENVELOPE SCREEN ========== */
#envelope-screen{
  position:fixed;
  inset:0;
  background:var(--paper);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
  transition:opacity .8s ease, visibility .8s ease;
}

.envelope{
  width:320px;
  height:220px;
  background:#fff;
  position:relative;
  box-shadow:0 30px 60px rgba(0,0,0,.12);
}

.envelope:before,
.envelope:after{
  content:"";
  position:absolute;
  inset:0;
  border:1px solid #ddd;
}

.flap{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:50%;
  background:#f1ede7;
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top;
  transition:transform 1s ease;
}

.seal{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:80px;
  height:80px;
  background:var(--seal);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Bodoni Moda", serif;
  font-size:26px;
  letter-spacing:.05em;
  cursor:pointer;
  box-shadow:0 6px 14px rgba(0,0,0,.15);
}

.open .flap{
  transform:rotateX(180deg);
}

/* ========== MAIN SITE ========== */
#site{
  opacity:0;
  transition:opacity 1s ease;
}

.lang{
  position:fixed;
  top:16px;
  right:18px;
  display:flex;
  gap:10px;
  font-size:13px;
}

.lang a{
  text-decoration:none;
  color:#555;
  border-bottom:1px solid transparent;
}

.lang a.active{
  color:#111;
  border-bottom-color:#111;
  font-weight:600;
}

main{
  max-width:900px;
  margin:0 auto;
  padding:140px 18px 90px;
}

h1{
  font-family:"Bodoni Moda", serif;
  font-size:56px;
  letter-spacing:.10em;
  font-weight:600;
  text-transform:uppercase;
  margin:0 0 14px;
}

.lead{
  font-size:20px;
  line-height:1.8;
}

.dateLine{
  display:block;
  margin-top:10px;
  font-size:15px;
  color:#333;
}

.nav{
  margin-top:34px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  max-width:760px;
  margin-inline:auto;
}

.nav a{
  text-decoration:none;
  color:#111;
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px 12px;
  font-size:15px;
  background:#fff;
}

@media(max-width:720px){
  h1{font-size:40px}
  .nav{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:480px){
  h1{font-size:36px}
  .lead{font-size:17px}
}
</style>
</head>

<body>

<!-- ENVELOPE -->
<div id="envelope-screen">
  <div class="envelope">
    <div class="flap"></div>
    <div class="seal" id="openBtn">A&K</div>
  </div>
</div>

<!-- SITE -->
<div id="site">

<div class="lang">
  <a href="#" data-lang="fr" class="active">FR</a>
  <a href="#" data-lang="it">IT</a>
  <a href="#" data-lang="en">EN</a>
</div>

<main>

<section data-content="fr">
  <h1>Alice & Kévin</h1>
  <p class="lead">ont le plaisir de vous inviter à célébrer leur mariage</p>
  <span class="dateLine">20 juin 2026 · Syracuse, Sicile</span>

  <div class="nav">
    <a href="programme.html">Le Mariage</a>
    <a href="agenda.html">Les Temps Forts</a>
    <a href="rsvp.html">RSVP</a>
    <a href="cadeaux.html">Cadeaux</a>
  </div>
</section>

</main>
</div>

<script>
const openBtn = document.getElementById("openBtn");
const envelope = document.querySelector(".envelope");
const screen = document.getElementById("envelope-screen");
const site = document.getElementById("site");

openBtn.addEventListener("click", ()=>{
  envelope.classList.add("open");
  setTimeout(()=>{
    screen.style.opacity="0";
    screen.style.visibility="hidden";
    site.style.opacity="1";
  },800);
});
</script>

</body>
</html>
