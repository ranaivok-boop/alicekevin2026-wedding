<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alice & Kevin</title>

  <!-- Main styles -->
  <link rel="stylesheet" href="./styles.css" />

  <!-- Intro interaction (fade + enter) -->
  <script defer src="./intro.js"></script>
</head>

<body>
  <main
    class="intro"
    id="intro"
    role="button"
    tabindex="0"
    aria-label="Enter the wedding website"
  >
    <img
      class="intro-img"
      src="./assets/intro.webp"
      alt="Alice & Kevin — Wedding Invitation"
      loading="eager"
      decoding="async"
    />

    <!-- subtle hint (premium + discreet) -->
    <div class="intro-hint" id="introHint" aria-hidden="true">Click to enter</div>

    <!-- fade overlay (paper tone) -->
    <div class="fade-overlay" id="fadeOverlay" aria-hidden="true"></div>
  </main>
</body>
</html>
