<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alice & Kevin — Invitation</title>
  <meta name="description" content="Invitation de mariage — Alice & Kevin" />

  <!-- Preloads -->
  <link rel="preload" as="image" href="assets/images/envelope-photo-1152.jpg">
  <link rel="preload" as="image" href="assets/images/seal.png">

  <link rel="stylesheet" href="css/style.css" />

  <!-- FULLSCREEN + CLEAN INTERACTION -->
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f7f3ee;
    }

    /* Fullscreen landing */
    #landing.landing {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .landing__frame {
      width: 100vw;
      height: 100vh;
      max-width: none !important;
      max-height: none !important;
      margin: 0 !important;
      padding: 0 !important;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Envelope button — NO visual feedback */
    #envelopeButton.envelope {
      width: 100vw;
      height: 100vh;
      border: 0;
      padding: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;

      /* 🔴 SUPPRESSION DU CERCLE */
      outline: none;
      box-shadow: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Remove all focus / active visuals */
    #envelopeButton:focus,
    #envelopeButton:focus-visible,
    #envelopeButton:active {
      outline: none;
      box-shadow: none;
    }

    /* Kill any pseudo-element overlay */
    #envelopeButton::before,
    #envelopeButton::after {
      content: none !important;
      display: none !important;
    }

    /* Scene fullscreen */
    #scene.envelope__scene {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Overlays */
    .landing__hint,
    .landing__credit {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 5;
    }

    .landing__hint { top: 16px; }
    .landing__credit { bottom: 16px; }
  </style>
</head>

<body>
  <!-- Landing: enveloppe -->
  <main id="landing" class="landing" aria-label="Ouverture de l'invitation">
    <div class="landing__frame">

      <div class="landing__hint" aria-hidden="true">
        <span class="dot"></span>
        <span>Cliquez pour ouvrir</span>
      </div>

      <button id="envelopeButton" class="envelope" type="button" aria-label="Ouvrir l'enveloppe">
        <div class="envelope__scene" id="scene">
          <div class="envelope__layer envelope__base" aria-hidden="true"></div>
          <div class="envelope__layer envelope__flap envelope__flap--top" aria-hidden="true"></div>
          <div class="envelope__layer envelope__flap envelope__flap--left" aria-hidden="true"></div>
          <div class="envelope__layer envelope__flap envelope__flap--right" aria-hidden="true"></div>

          <img class="envelope__seal" id="seal" src="assets/images/seal.png" alt="" aria-hidden="true" />
          <div class="envelope__sealShadow" id="sealShadow" aria-hidden="true"></div>
        </div>
      </button>

      <div class="landing__credit" aria-hidden="true">
        <span>Invitation</span>
        <span class="sep">•</span>
        <span>A&K</span>
      </div>

    </div>
  </main>

  <!-- GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="js/animation.js"></script>
</body>
</html>
